nav a:hover{background:var(--navy2)}
nav a.on{background:var(--blue);color:#fff;font-weight:600}
nav a .ic{width:20px;text-align:center}
.side-foot{margin-top:auto;font-size:12px;color:#8fa8cf;padding:0 10px;line-height:1.5}
main{min-width:0}

.demo-tag{background:var(--warnbg);color:var(--warn);font-weight:700;font-size:12px;padding:5px 10px;border-radius:99px}
select,input,button{font:inherit}
select,input[type=text],input[type=number],input[type=search]{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;color:var(--text);min-width:0}
select:focus,input:focus{outline:2px solid #b9d3f0;border-color:var(--blue)}
.btn{border:0;background:var(--blue);color:#fff;padding:9px 16px;border-radius:8px;font-weight:600;cursor:pointer}
.btn:hover{background:#245f94}
.btn.sec{background:#fff;color:var(--navy);border:1px solid var(--line)}

.btn.sm{padding:5px 11px;font-size:13px}
.btn:disabled{background:#c9d3e2;cursor:not-allowed;color:#fff}
.content{padding:26px 28px 60px;max-width:1280px}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(4,1fr)}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.card h3{margin:0 0 12px;font-size:16px;color:var(--navy)}
.kpi .l{font-size:12px;color:var(--gray);text-transform:uppercase;letter-spacing:.08em;font-weight:700}

.kpi .s{font-size:13px;color:var(--gray);margin-top:2px}
.cols2{grid-template-columns:1.2fr 1fr}
.cols2b{grid-template-columns:1fr 1fr}
.hero{background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;border-radius:14px;padding:22px 26px;display:flex;justify-content:space-between;gap:20px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.hero h2{margin:0 0 6px;font-size:21px}
.hero p{margin:0;color:#cfdcf2;max-width:640px;line-height:1.5}

table{border-collapse:collapse;width:100%}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--gray);text-align:left;padding:9px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}

td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
.badge{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{background:#fff;border:1px solid var(--line);border-radius:99px;padding:5px 13px;cursor:pointer;font-size:13.5px;color:var(--navy)}
.chip:hover{background:var(--light)}
.callout{border-left:5px solid var(--ok);background:var(--okbg);padding:12px 16px;border-radius:8px;margin-bottom:14px;line-height:1.5}
.callout.w{border-color:#f59e0b;background:var(--warnbg)}
.callout.i{border-color:var(--blue);background:#e8f1fb}
.form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.05em}

.list .it{padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px;align-items:center}

.list .it.on{border-color:var(--blue);background:#f0f6fd;box-shadow:0 0 0 2px #cfe2f6}

#modal{position:fixed;inset:0;background:rgba(20,40,75,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal.show{display:flex}
#modal .box{background:#fff;border-radius:14px;padding:24px;width:min(460px,100%)}
#modal h3{margin:0 0 14px;color:var(--navy)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);display:none;z-index:60;max-width:92vw}

@media print{
 aside,.top,.noprint,#toast{display:none!important}
 .app{display:block}.content{padding:0}body{background:#fff}

</style>
</head>

const ROLES={
 'Médico':['pacientes','buscar'],
 'Bodega':['panel','buscar','inventario','descargo'],
 'Facturación':['panel','facturacion','reportes'],
 'Administrador':['panel','buscar','descargo','inventario','facturacion','reportes']};
const MENU={pacientes:['☺','Mis pacientes'],panel:['▦','Panel'],buscar:['⌕','Buscar disponibilidad'],descargo:['✎','Descargo de insumos'],inventario:['▤','Inventario'],facturacion:['$','Facturación'],reportes:['▥','Reportes']};

/* ===================== UTILIDADES ===================== */
const $=s=>document.querySelector(s);
const money=n=>'$'+n.toLocaleString('es-EC',{minimumFractionDigits:2,maximumFractionDigits:2});
const num=n=>n.toLocaleString('es-EC');
const tot=id=>BODEGAS.reduce((a,b)=>a+S.stock[id][b.id],0);
const daysTo=d=>Math.round((new Date(d)-new Date(HOY))/864e5);
const fdate=d=>{const[y,m,dd]=d.split('-');return dd+'/'+m+'/'+y};
const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function toast(m,bad){const t=$('#toast');t.textContent=m;t.className=bad?'bad':'';t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3600)}
function modal(html){$('#mbox').innerHTML=html;$('#modal').classList.add('show')}
function closeModal(){$('#modal').classList.remove('show')}
const stockChip=(q,min)=>`<span class="stock ${q<=0?'s-no':'s-yes'}">${q<=0?'—':num(q)}</span>`;
function estado(p){
  const t=tot(p.id);const out=[];
  if(t<p.min)out.push('<span class="badge b-bad">Stock bajo</span>');
  if(p.cad&&daysTo(p.cad)<=90)out.push('<span class="badge b-warn">Por caducar</span>');
  return out.length?out.join(' '):'<span class="badge b-ok">OK</span>';
}
function cuentaTotals(c){
  let s0=0,s15=0;
  c.items.forEach(([pid,q])=>{const p=PBY[pid];const v=p.p*q;p.iva?s15+=v:s0+=v});
  const iva=Math.round(s15*0.15*100)/100;
  return{s0,s15,iva,total:s0+s15+iva};
}
function rnd(n){let s='';for(let i=0;i<n;i++)s+=Math.floor(Math.random()*10);return s}

/* ===================== VISTAS ===================== */
const V={};

   <div class="card kpi"><div class="l">Alertas de stock bajo</div><div class="v" style="color:var(--bad)">${alertas.length}</div><div class="s">${cad.length} por caducar en 90 días</div></div>
   <div class="card kpi"><div class="l">Pendientes</div><div class="v">${pend}</div><div class="s">${pend} descargo(s) por entregar · ${porFact} cuenta(s) por facturar</div></div>
  </div>
  <div class="grid cols2 mt">
   <div class="card"><h3>Valor del inventario por bodega</h3>
    ${valBod.map(x=>`<div class="barrow"><span>${x.b.n}</span><div class="bar"><i style="width:${x.v/maxV*100}%"></i></div><span class="v">${money(x.v)}</span></div>`).join('')}
   </div>
   <div class="card"><h3>Alertas</h3>
    ${alertas.slice(0,5).map(p=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)"><span>${p.n}</span><span class="badge b-bad">${num(tot(p.id))} / mín. ${num(p.min)}</span></div>`).join('')||'<div class="muted">Sin alertas de stock.</div>'}
    ${cad.slice(0,3).map(p=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)"><span>${p.n}</span><span class="badge b-warn">vence ${fdate(p.cad)}</span></div>`).join('')}
   </div>
  </div>
  <div class="card mt"><h3>Últimos movimientos</h3><div class="tw"><table><tr><th>Fecha</th><th>Tipo</th><th>Producto</th><th class="n">Cant.</th><th>Origen</th><th>Destino / servicio</th></tr>
   ${movs.map(m=>`<tr><td>${fdate(m.fecha)}</td><td><span class="badge ${m.tipo==='Descargo'?'b-blue':m.tipo==='Ingreso'?'b-ok':'b-gray'}">${m.tipo}</span></td><td>${PBY[m.pid].n}</td><td class="n">${num(m.qty)}</td><td>${BN[m.bod]}</td><td>${m.dest?BN[m.dest]:m.serv||'—'}</td></tr>`).join('')}
  </table></div></div>`;

function bestBod(pid,qty,pref){
  if(S.stock[pid][pref]>=qty)return pref;
  let b=null,m=0;BODEGAS.forEach(x=>{const v=S.stock[pid][x.id];if(v>=qty&&v>m){m=v;b=x.id}});return b;
}
function findProd(name){const n=norm(name.trim());if(!n)return null;return PROD.find(x=>norm(x.n)===n)||PROD.find(x=>norm(x.n).includes(n))}
function availHtml(name){
  const p=findProd(name);if(!p)return name.trim()?'<div class="muted" style="margin-top:12px">No se encontró ese producto.</div>':'';
  const chips=BODEGAS.map(b=>`<span style="margin-right:14px;white-space:nowrap"><span class="muted">${b.n.replace('Bodega ','')}</span> ${stockChip(S.stock[p.id][b.id])}</span>`).join('');
  let msg='';
  if(tot(p.id)>0)msg=`<div class="callout" style="margin:10px 0 0">Disponible: <b>${p.n}</b> (${num(tot(p.id))} en total). Se pedirá a la bodega que tenga existencia.</div>`;
  else{const alt=(ALT[p.id]||[]).filter(i=>tot(i)>0).map(i=>PBY[i].n);
   msg=`<div class="callout w" style="margin:10px 0 0">Sin existencia de <b>${p.n}</b>.${alt.length?' Alternativas con stock: <b>'+alt.join(', ')+'</b>.':' Consulte con farmacia.'}</div>`}
  return`<div style="margin-top:12px">${chips}</div>${msg}`;
}

V.buscar=()=>{
  const q=norm(query.trim());
  const res=q?PROD.filter(p=>norm(p.n).includes(q)||norm(p.cat).includes(q)):[];
  let call='';
  if(q&&res.length){
    const p=res[0];const where=BODEGAS.filter(b=>S.stock[p.id][b.id]>0);
    call=where.length?`<div class="callout"><b>${p.n}</b> está disponible en ${where.map(b=>`<b>${b.n}</b> (${num(S.stock[p.id][b.id])})`).join(' y ')}. El médico puede recetarlo o usarlo ahora.</div>`
     :`<div class="callout w"><b>${p.n}</b> no tiene existencia en ninguna bodega. Se sugiere generar una solicitud de compra.</div>`;
  }
  return`
  <div class="searchbar"><input type="search" id="q" placeholder="Busca un medicamento o insumo (ej. aspirina, jeringuilla, guantes)…" value="${query.replace(/"/g,'&quot;')}" autofocus></div>
  <div class="chips">${['Aspirina','Cefazolina','Jeringuilla','Guantes','Bisturí','Alcohol','Tubo endotraqueal'].map(c=>`<span class="chip" data-q="${c}">${c}</span>`).join('')}</div>
  ${call}
  <div class="card">${!q?'<div class="empty">Escribe el nombre de un producto para ver su disponibilidad en las 4 bodegas.</div>':!res.length?'<div class="empty">No se encontró ningún producto con ese nombre.</div>':`
  <div class="tw"><table><tr><th>Producto</th>${BODEGAS.map(b=>`<th class="n">${b.n.replace('Bodega ','')}</th>`).join('')}<th class="n">Total</th><th>Precio</th><th></th></tr>
  ${res.map(p=>`<tr><td><b>${p.n}</b><div class="muted">${p.cat} · ${p.u}</div></td>
   ${BODEGAS.map(b=>`<td class="n">${stockChip(S.stock[p.id][b.id])}</td>`).join('')}
   <td class="n"><b>${num(tot(p.id))}</b></td><td>${money(p.p)}</td>
   <td>${tot(p.id)>0?`<button class="btn sm" data-use="${p.id}">${role==='Médico'?'Indicar a paciente':'Usar en descargo'}</button>`:'<span class="badge b-bad">Agotado</span>'}</td></tr>`).join('')}
  </table></div>`}</div>`;
};

V.facturacion=()=>{
  const ids=Object.keys(S.cuentas);
  if(!invSel||!S.cuentas[invSel])invSel=ids.find(i=>!S.cuentas[i].factura)||ids[0];
  const c=S.cuentas[invSel];const pac=PAC[invSel];const T=cuentaTotals(c);
  const list=ids.map(id=>{const cc=S.cuentas[id];const t=cuentaTotals(cc);return`<div class="it ${id===invSel?'on':''}" data-inv="${id}"><div><b>${PAC[id].n}</b><br><small>${cc.serv} · ${cc.items.length} ítems</small></div><div style="text-align:right"><b>${money(t.total)}</b><br>${cc.factura?'<span class="badge b-ok">Facturada</span>':'<span class="badge b-warn">Por facturar</span>'}</div></div>`}).join('');
  const f=c.factura;
  return`
  <div class="grid cols2b" style="grid-template-columns:340px 1fr">
   <div class="card listcard"><h3>Cuentas de pacientes</h3><div class="list">${list}</div><div class="muted">Se llenan automáticamente con los descargos entregados.</div></div>
   <div>
    <div class="inv" id="invoice">
     <div class="hd"><div><h2>FACTURA</h2><div class="muted">Clínica Demo · RUC 0999999999001</div></div>
      <div style="text-align:right"><b>${f?f.num:'001-001-(sin emitir)'}</b><br>${f?'<span class="badge b-ok">Autorizada SRI (simulación)</span>':'<span class="badge b-warn">Borrador</span>'}</div></div>
     <div class="meta"><div><b>Cliente</b>${pac.n}</div><div><b>Cédula</b>${pac.ci}</div><div><b>Historia clínica</b>${pac.hc}</div><div><b>Fecha de emisión</b>${fdate(f?f.fecha:HOY)}</div></div>
     <div class="tw"><table><tr><th>Descripción</th><th class="n">Cant.</th><th class="n">P. unit.</th><th class="n">IVA</th><th class="n">Subtotal</th></tr>
     ${c.items.map(([pid,q])=>{const p=PBY[pid];return`<tr><td>${p.n}</td><td class="n">${q}</td><td class="n">${money(p.p)}</td><td class="n">${p.iva}%</td><td class="n">${money(p.p*q)}</td></tr>`}).join('')}</table></div>
     <div class="tot"><div><span>Subtotal IVA 0 %</span><span>${money(T.s0)}</span></div><div><span>Subtotal IVA 15 %</span><span>${money(T.s15)}</span></div><div><span>IVA 15 %</span><span>${money(T.iva)}</span></div><div class="g"><span>TOTAL</span><span>${money(T.total)}</span></div></div>
     ${f?`<div class="clave"><b>Clave de acceso:</b> ${f.clave}</div>`:''}
    </div>

   </div>
  </div>`;
};

V.reportes=()=>{
  const des=S.movs.filter(m=>m.tipo==='Descargo');
  const porServ={};SERVICIOS.forEach(s=>porServ[s]=0);
  des.forEach(m=>{if(porServ[m.serv]!==undefined)porServ[m.serv]+=PBY[m.pid].p*m.qty});
  const maxS=Math.max(...Object.values(porServ),1);
  const porProd={};des.forEach(m=>porProd[m.pid]=(porProd[m.pid]||0)+m.qty);
  const top=Object.entries(porProd).sort((a,b)=>b[1]-a[1]).slice(0,6);const maxP=top[0]?top[0][1]:1;
  const cad=PROD.filter(p=>p.cad).sort((a,b)=>a.cad.localeCompare(b.cad)).slice(0,6);
  const fact=Object.entries(S.cuentas).filter(([,c])=>c.factura).reduce((a,[,c])=>a+cuentaTotals(c).total,0);
  const porCobrar=Object.entries(S.cuentas).filter(([,c])=>!c.factura).reduce((a,[,c])=>a+cuentaTotals(c).total,0);
  return`
  <div class="grid kpis" style="grid-template-columns:repeat(3,1fr)">
   <div class="card kpi"><div class="l">Facturado</div><div class="v">${money(fact)}</div></div>
   <div class="card kpi"><div class="l">Por facturar</div><div class="v">${money(porCobrar)}</div></div>
   <div class="card kpi"><div class="l">Descargos registrados</div><div class="v">${new Set(des.map(m=>m.ref)).size}</div></div>
  </div>
  <div class="grid cols2b mt">
   <div class="card"><h3>Consumo por servicio (valor)</h3>${SERVICIOS.map(s=>`<div class="barrow"><span>${s}</span><div class="bar"><i style="width:${porServ[s]/maxS*100}%"></i></div><span class="v">${money(porServ[s])}</span></div>`).join('')}</div>
   <div class="card"><h3>Productos más consumidos (unidades)</h3>${top.map(([pid,q])=>`<div class="barrow"><span style="font-size:13px">${PBY[pid].n}</span><div class="bar"><i style="width:${q/maxP*100}%"></i></div><span class="v">${num(q)}</span></div>`).join('')}</div>
  </div>
  <div class="card mt"><h3>Próximos a caducar</h3><div class="tw"><table><tr><th>Producto</th><th>Caduca</th><th class="n">Días</th><th class="n">Stock total</th></tr>
  ${cad.map(p=>{const d=daysTo(p.cad);return`<tr><td>${p.n}</td><td>${fdate(p.cad)}</td><td class="n"><span class="badge ${d<=90?'b-warn':'b-gray'}">${d}</span></td><td class="n">${num(tot(p.id))}</td></tr>`}).join('')}</table></div>
  <div class="muted" style="margin-top:10px">En el sistema real: exportación a Excel de todos los reportes.</div></div>`;
};

/* ===================== LÓGICA ===================== */
function entregar(id){
  const d=S.descargos.find(x=>x.id===id);if(!d)return;
  for(const it of d.items){
    const have=S.stock[it.pid][d.bod];
    if(have<it.qty){
      const otras=BODEGAS.filter(b=>b.id!==d.bod&&S.stock[it.pid][b.id]>0).map(b=>`${b.n} (${S.stock[it.pid][b.id]})`).join(', ');
      toast(`Sin stock suficiente de “${PBY[it.pid].n}” en ${BN[d.bod]}.${otras?' Disponible en: '+otras+'.':' No hay en otras bodegas.'}`,true);return;
    }
  }
  d.items.forEach(it=>{
    S.stock[it.pid][d.bod]-=it.qty;
    S.movs.push({fecha:HOY,tipo:'Descargo',pid:it.pid,qty:it.qty,bod:d.bod,dest:'',serv:d.serv,ref:d.id});
    const c=S.cuentas[d.pac]||(S.cuentas[d.pac]={serv:d.serv,items:[],factura:null});
    if(c.factura){S.cuentas[d.pac]={serv:d.serv,items:[],factura:null}}
    S.cuentas[d.pac].items.push([it.pid,it.qty,HOY]);
  });
  d.estado='Entregado';save();toast(`Descargo ${id} entregado. El stock se descontó y la cuenta del paciente se actualizó.`);render();
}

/* ===================== RENDER Y EVENTOS ===================== */
let route='panel';
function allowed(){return ROLES[role]}
function render(){
  if(!allowed().includes(route))route=allowed()[0];
  $('#nav').innerHTML=allowed().map(r=>`<a href="#${r}" class="${r===route?'on':''}"><span class="ic">${MENU[r][0]}</span>${MENU[r][1]}</a>`).join('');
  $('#title').textContent=MENU[route][1];
  $('#view').innerHTML=V[route]();
  document.title=MENU[route][1]+' · Demo Shaotech';
  const q=$('#q');if(q&&document.activeElement!==q){/* mantiene foco al buscar */}
}
function go(r){route=r;if(location.hash!=='#'+r)location.hash=r;render();window.scrollTo(0,0)}
window.addEventListener('hashchange',()=>{const r=location.hash.slice(1);if(MENU[r]&&r!==route){route=r;render()}});

$('#role').innerHTML=Object.keys(ROLES).map(r=>`<option ${r===role?'selected':''}>${r}</option>`).join('');
function setRole(r){role=r;$('#role').value=r;try{localStorage.setItem(KEY+'_role',r)}catch(_){}selPac=null;pendingProd='';route=ROLES[r][0];location.hash=route;render();window.scrollTo(0,0)}
$('#role').onchange=e=>setRole(e.target.value);
$('#reset').onclick=()=>{S=seed();save();invSel=null;query='';toast('Demo restablecida a los datos originales.');go('panel')};
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});

document.addEventListener('input',e=>{
  if(e.target.id==='q'){query=e.target.value;const pos=e.target.selectionStart;render();const q=$('#q');q.focus();q.setSelectionRange(pos,pos)}
  if(e.target.id==='m-prod'){pendingProd=e.target.value;$('#m-avail').innerHTML=availHtml(pendingProd)}
  if(e.target.id==='f-q'){fQ=e.target.value;const pos=e.target.selectionStart;render();const q=$('#f-q');q.focus();q.setSelectionRange(pos,pos)}
});
document.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='f-bod'){fBod=e.target.value;render()}
  if(id==='f-cat'){fCat=e.target.value;render()}
  if(id==='d-serv'){S.draft.serv=e.target.value;S.draft.bod=SERV_BODEGA[e.target.value];save();render()}
  if(id==='d-bod'){S.draft.bod=e.target.value;save();render()}
  if(id==='d-pac'){S.draft.pac=e.target.value;save()}
  if(id==='d-med'){S.draft.medico=e.target.value;save()}
});
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-pac],[data-mq],[data-role],#m-add,[data-go],[data-q],[data-use],[data-rm],[data-ok],[data-tr],[data-inv],#d-add,#d-send,#emit,#print');if(!t)return;
  const ds=t.dataset;
  if(ds.pac!==undefined){selPac=ds.pac||null;pendingProd='';render()}
  else if(ds.mq){pendingProd=ds.mq;render()}
  else if(ds.role){setRole(ds.role)}
  else if(t.id==='m-add'){
    const p=PAC[selPac];const prod=findProd($('#m-prod').value);const q=Math.max(1,parseInt($('#m-qty').value)||1);
    if(!prod){toast('Elige un producto de la lista.',true);return}
    const bod=bestBod(prod.id,q,SERV_BODEGA[p.serv]);
    if(!bod){const alt=(ALT[prod.id]||[]).filter(i=>tot(i)>0).map(i=>PBY[i].n);toast('No hay stock suficiente de “'+prod.n+'” en ninguna bodega.'+(alt.length?' Alternativas: '+alt.join(', ')+'.':''),true);return}
    const id='D-'+String(S.seq++).padStart(4,'0');
    S.descargos.push({id,fecha:HOY,serv:p.serv,pac:p.id,medico:p.medico,bod,items:[{pid:prod.id,qty:q}],estado:'Pendiente'});
    pendingProd='';save();toast('Indicación enviada a '+BN[bod]+(bod!==SERV_BODEGA[p.serv]?' (no había en la bodega del servicio)':'')+'. Bodega la verá para entregar.');render();
  }
  else if(ds.go){if(ds.go==='buscar')query='aspirina';go(ds.go)}
  else if(ds.q){query=ds.q;render()}
  else if(ds.use&&role==='Médico'){pendingProd=PBY[ds.use].n;if(!selPac)toast('Elige un paciente para indicarle “'+pendingProd+'”.');go('pacientes')}
  else if(ds.use){const p=PBY[ds.use];S.draft.items.push({pid:p.id,qty:1});save();toast(`“${p.n}” agregado al descargo.`);go('descargo')}
  else if(ds.rm!==undefined){S.draft.items.splice(+ds.rm,1);save();render()}
  else if(ds.ok){entregar(ds.ok)}
  else if(ds.inv){invSel=ds.inv;render()}
  else if(ds.tr){
    const p=PBY[ds.tr];
    modal(`<h3>Transferir: ${p.n}</h3><div class="form" style="grid-template-columns:1fr">
     <label>Desde<select id="t-from">${BODEGAS.map(b=>`<option value="${b.id}">${b.n} (${num(S.stock[p.id][b.id])})</option>`).join('')}</select></label>
     <label>Hacia<select id="t-to">${BODEGAS.map((b,i)=>`<option value="${b.id}" ${i===1?'selected':''}>${b.n}</option>`).join('')}</select></label>
     <label>Cantidad<input type="number" id="t-qty" min="1" value="1"></label></div>
     <div style="margin-top:16px;display:flex;gap:10px;justify-content:flex-end"><button class="btn sec" id="t-cancel">Cancelar</button><button class="btn" id="t-ok" data-pid="${p.id}">Transferir</button></div>`);
  }
  else if(t.id==='d-add'){
    const name=$('#d-prod').value.trim();const q=Math.max(1,parseInt($('#d-qty').value)||1);
    const p=PROD.find(x=>norm(x.n)===norm(name))||PROD.find(x=>norm(x.n).includes(norm(name)));
    if(!name||!p){toast('Elige un producto de la lista.',true);return}
    const ex=S.draft.items.find(i=>i.pid===p.id);ex?ex.qty+=q:S.draft.items.push({pid:p.id,qty:q});save();render();
  }
  else if(t.id==='d-send'){
    const d=S.draft;const id='D-'+String(S.seq++).padStart(4,'0');
    S.descargos.push({id,fecha:HOY,serv:d.serv,pac:d.pac,medico:d.medico,bod:d.bod,items:d.items.map(i=>({...i})),estado:'Pendiente'});
    d.items=[];save();toast(`Solicitud ${id} enviada a ${BN[d.bod]}. Cambia a “Bodega” para aprobarla.`);render();
  }
  else if(t.id==='emit'){
    const c=S.cuentas[invSel];const n=String(118+Object.values(S.cuentas).filter(x=>x.factura).length).padStart(9,'0');
    c.factura={num:'001-001-'+n,clave:'0511202601'+'0999999999001'+'1'+'001001'+n+rnd(9)+'1',fecha:HOY};
    save();toast('Factura emitida y autorizada (simulación).');render();
  }
  else if(t.id==='print'){window.print()}
});
document.addEventListener('click',e=>{
  if(e.target.id==='t-cancel')closeModal();
  if(e.target.id==='t-ok'){
    const pid=e.target.dataset.pid;const from=$('#t-from').value,to=$('#t-to').value,q=parseInt($('#t-qty').value)||0;
    if(from===to){toast('Elige bodegas distintas.',true);return}
    if(q<1||q>S.stock[pid][from]){toast('Cantidad no válida: hay '+S.stock[pid][from]+' en el origen.',true);return}
    S.stock[pid][from]-=q;S.stock[pid][to]+=q;
    S.movs.push({fecha:HOY,tipo:'Transferencia',pid,qty:q,bod:from,dest:to,serv:'',ref:'T-'+String(S.tseq++).padStart(4,'0')});
    save();closeModal();toast(`Transferidas ${q} unidades a ${BN[to]}.`);render();
  }
});

route=MENU[location.hash.slice(1)]?location.hash.slice(1):'panel';
render();
</script>
</body>
</html>
